name: Workflow CI-build (GitHub pages)
on:
  workflow_call:
  push:
  workflow_dispatch:

# Annule tout run ci-build précédent encore en cours sur la même branche/PR
# dès qu'un nouveau push arrive, pour économiser des minutes GitHub Actions.
concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-sushi-tests_gitHubPages:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ansforge/fhir-ig-builder:latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: igSource
      - uses: ansforge/IG-workflows@main
        with:
          repo_ig: "./igSource"
          github_page: "true"
          github_page_token: ${{ secrets.GITHUB_TOKEN }}
          bake: "false"
          validator_cli: "false"
          generate_testscript: "false"
          generate_plantuml: "false"
          container_mode: "true"
